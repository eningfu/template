<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sodascribbles!</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link href="/neocities-sodascribbles/universal.css" rel="stylesheet" type="text/css" media="all" />
    <link href="/neocities-sodascribbles/style.css" rel="stylesheet" type="text/css" media="all" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barrio&family=Cherry+Bomb+One&family=Darumadrop+One&family=DotGothic16&family=Jersey+10&family=Jersey+15&family=Londrina+Sketch&family=Shizuru&family=Silkscreen&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header
      onclick="location.href = 'https://[name].neocities.org/'"
    ></header>
    <div class="nav">
      <button onclick="location.href = 'index.html'" class="active">
        HOME
      </button>
      <button onclick="location.href = 'gallery.html'">gallery</button>
    </div>
    <div class="three-column-layout">
      <div class="column left">
        <div class="content-wrap">
          <div class="top">
            <h1><strong>updates</strong></h1>
          </div>
          <div class="update-container">
            <div class="update-logs">
              <p class="update">
                <span class="timestamp"
                  ><strong>[2025-09-05]</strong></span
                >
                > Update log
              </p>
            </div>
          </div>
        </div>
        <div class="content-wrap" style="margin-top: 10px">
          <div class="top">
            <h1><strong>links</strong></h1>
          </div>
          <div class="external">
            <a
              href="https://github.com/eningfu/neocities-template"
              target="_blank"
              rel="noopener noreferrer"
              class="link"
              >github repo</a
            >
            <a
              href=""
              target="_blank"
              rel="noopener noreferrer"
              class="link"
              >[link]</a
            >
            <a
              href=""
              target="_blank"
              rel="noopener noreferrer"
              class="link"
              >[link]</a
            >
          </div>
        </div>
      </div>
      <div class="column middle">
        <div class="content-wrap" style="margin-bottom: 10px">
          <div class="top">
            <h1><strong>name</strong></h1>
          </div>
          <div class="about">
            <p>
              [bio]
            </p>
          </div>
        </div>
        <div class="row">
          <div class="content-wrap row-ver qa">
            <div class="top">
              <h1><strong>section</strong></h1>
            </div>
            <div class="about">
              <p>[stuff]</p>
            </div>    
          </div>
          <div class="content-wrap row-ver qa">
            <div class="top">
              <h1><strong>section</strong></h1>
            </div>
            <div class="about">
              <img src="" width="100%" style="display: block" />
            </div>
            <div class="content caption">
              <p>
                [caption]
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
